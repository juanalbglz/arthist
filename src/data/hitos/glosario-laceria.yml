es:
  titulo: "Lacería"
  texto: "Decoración de líneas que se cruzan formando estrellas y polígonos sin fin. El arte islámico la usa para sugerir lo infinito sin representar figuras."
en:
  titulo: "Interlace (lacería)"
  texto: "Decoration of crossing lines that form endless stars and polygons. Islamic art uses it to suggest the infinite without depicting figures."
