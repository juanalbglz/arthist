es:
  titulo: "Óleo"
  texto: "Pintura con pigmentos mezclados con aceite. Los flamencos la perfeccionan en el siglo XV, aunque ya se usó en las cuevas de Bamiyán (Afganistán) en el siglo VII."
en:
  titulo: "Oil paint"
  texto: "Painting with pigments mixed in oil. The Flemish perfect it in the 15th century, though it was already used in the Bamiyan caves (Afghanistan) in the 7th century."
