es:
  titulo: "Mosaico"
  texto: "Imagen hecha con pequeñas piezas de piedra, concha, vidrio o cerámica. Los sumerios ya lo usan en el Estandarte de Ur; luego lo desarrollan Roma, Bizancio y el islam."
en:
  titulo: "Mosaic"
  texto: "An image made of small pieces of stone, shell, glass or ceramic. The Sumerians already use it in the Standard of Ur; Rome, Byzantium and Islam develop it further."
