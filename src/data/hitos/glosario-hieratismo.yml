es:
  titulo: "Hieratismo"
  texto: "Figuras rígidas, frontales y solemnes, que no expresan emociones: muestran a dioses y faraones como seres eternos. Aparece en Egipto y vuelve en el arte bizantino y románico."
en:
  titulo: "Hieratism"
  texto: "Rigid, frontal, solemn figures that show no emotion, presenting gods and pharaohs as eternal beings. It appears in Egypt and returns in Byzantine and Romanesque art."
