es:
  titulo: "Bóveda de crucería"
  texto: "Bóveda reforzada por nervios que se cruzan y llevan el peso a los pilares. Permite muros más finos y grandes ventanas: es la base del gótico."
en:
  titulo: "Rib vault"
  texto: "A vault reinforced by crossing ribs that carry the weight to the piers. It allows thinner walls and large windows: the basis of Gothic."
