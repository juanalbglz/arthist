es:
  titulo: "Abstracción"
  texto: "Arte que no representa objetos reconocibles: solo formas, líneas y color. Se atribuye a Kandinsky, pero Hilma af Klint ya pintaba así en 1906."
en:
  titulo: "Abstraction"
  texto: "Art that represents no recognisable objects, only shape, line and colour. Often credited to Kandinsky, though Hilma af Klint painted this way in 1906."
