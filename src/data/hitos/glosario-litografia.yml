es:
  titulo: "Litografía"
  texto: "Técnica de estampación sobre piedra que repele o retiene la tinta según el dibujo. Abarata la imagen impresa y llena de carteles las ciudades."
en:
  titulo: "Lithography"
  texto: "A printing technique on stone that repels or holds ink according to the drawing. It makes printed images cheap and fills cities with posters."
