es:
  titulo: "Artesonado"
  texto: "Techo de madera con piezas ensambladas que forman dibujos geométricos. De origen mudéjar, llega a Canarias y a América: hay ejemplos notables en iglesias de La Laguna y Teguise."
en:
  titulo: "Artesonado"
  texto: "A wooden ceiling of joined pieces forming geometric patterns. Of Mudéjar origin, it reaches the Canaries and the Americas, with notable examples in churches of La Laguna and Teguise."
