es:
  titulo: "Mímesis"
  texto: "Imitación de la naturaleza. Platón la desconfía porque es copia de una copia; Aristóteles la ve como forma de conocer. Guiará el arte europeo hasta el siglo XIX."
en:
  titulo: "Mimesis"
  texto: "Imitation of nature. Plato distrusts it as a copy of a copy; Aristotle sees it as a way of knowing. It guides European art until the 19th century."
