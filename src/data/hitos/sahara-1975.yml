es:
  titulo: España abandona el Sáhara Occidental
  texto: Los acuerdos de Madrid entregan el territorio a Marruecos y Mauritania sin descolonizarlo. El pueblo saharaui sigue esperando.
en:
  titulo: Spain leaves Western Sahara
  texto: The Madrid Accords hand the territory to Morocco and Mauritania without decolonising it. The Sahrawi people are still waiting.
