es:
  titulo: "Xilografía"
  texto: "Grabado en madera: se talla la imagen en relieve, se entinta y se estampa. El libro impreso fechado más antiguo es chino; siglos después dará el ukiyo-e japonés."
en:
  titulo: "Woodcut"
  texto: "Wood engraving: the image is carved in relief, inked and printed. The oldest dated printed book is Chinese; centuries later it produces Japanese ukiyo-e."
