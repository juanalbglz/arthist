es:
  titulo: "Talud y tablero"
  texto: "Forma de construir pirámides alternando un muro inclinado (talud) y un panel vertical (tablero). Es la firma de Teotihuacan y se copia por toda Mesoamérica."
en:
  titulo: "Talud-tablero"
  texto: "A way of building pyramids alternating a sloping wall (talud) and a vertical panel (tablero). It is Teotihuacan’s signature, copied across Mesoamerica."
