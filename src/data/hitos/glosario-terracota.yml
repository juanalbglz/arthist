es:
  titulo: "Terracota"
  texto: "Arcilla cocida usada para esculpir. Las cabezas de Nok, en la actual Nigeria, son de las más antiguas del África subsahariana; el ejército de Xi’an también es de terracota."
en:
  titulo: "Terracotta"
  texto: "Fired clay used for sculpture. The Nok heads in today’s Nigeria are among the oldest in sub-Saharan Africa; the Xi’an army is terracotta too."
