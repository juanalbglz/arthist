es:
  titulo: "Iconoclastia"
  texto: "Rechazo y destrucción de las imágenes religiosas. En Bizancio enfrenta al Estado durante más de un siglo; vuelve en la Reforma protestante."
en:
  titulo: "Iconoclasm"
  texto: "Rejection and destruction of religious images. In Byzantium it divides the state for over a century; it returns in the Protestant Reformation."
