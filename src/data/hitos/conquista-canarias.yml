es:
  titulo: Conquista de Canarias
  texto: Empieza con Béthencourt en Lanzarote y termina con la rendición de Tenerife. Las islas son el ensayo de la colonización atlántica.
en:
  titulo: Conquest of the Canary Islands
  texto: It begins with Béthencourt in Lanzarote and ends with the surrender of Tenerife. The islands are a rehearsal for Atlantic colonisation.
