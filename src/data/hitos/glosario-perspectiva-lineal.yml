es:
  titulo: "Perspectiva lineal"
  texto: "Método geométrico para representar la profundidad con líneas que convergen en un punto de fuga. China y Japón usan otros sistemas, como la perspectiva paralela."
en:
  titulo: "Linear perspective"
  texto: "A geometric method for showing depth with lines converging on a vanishing point. China and Japan use other systems, such as parallel perspective."
