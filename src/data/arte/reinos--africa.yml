id: reinos--africa
epoca: reinos
sociedades:
  - africa
es:
  area: "África"
  concepto: "El objeto vale por lo que hace: una máscara solo está completa en la danza; las cabezas de Ife hacen presente al rey."
  funcion: "Hablar con los ancestros, juzgar, curar, iniciar a los jóvenes y mostrar la riqueza del reino (Malí, Gran Zimbabue, Etiopía)."
  artista: "Herreros y fundidores con un estatus especial, temido o respetado; trabajan para la corte o la comunidad."
en:
  area: "Africa"
  concepto: "An object is worth what it does: a mask is only complete in the dance; the Ife heads make the king present."
  funcion: "To speak with ancestors, judge, heal, initiate the young and show the wealth of the kingdom (Mali, Great Zimbabwe, Ethiopia)."
  artista: "Smiths and casters with a special status, feared or respected; they work for the court or the community."
