id: vanguardias--africa
epoca: vanguardias
sociedades:
  - africa
es:
  area: "África"
  concepto: "En París, las máscaras se miran como «arte primitivo» sin su contexto; en África siguen siendo objetos con función."
  funcion: "Inspiran el cubismo; en su lugar de origen sirven al rito, la justicia y la iniciación."
  artista: "Escultores conocidos en su comunidad, pero anónimos en las colecciones europeas."
en:
  area: "Africa"
  concepto: "In Paris masks are viewed as “primitive art” without context; in Africa they remain functional objects."
  funcion: "They inspire Cubism; at home they serve ritual, justice and initiation."
  artista: "Sculptors known in their communities but anonymous in European collections."
