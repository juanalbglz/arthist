es:
  area: "Asia occidental y mundo islámico"
  concepto: "Otomanos y safávidas desarrollan un arte cortesano refinado: miniatura, cerámica de İznik, alfombras, arquitectura."
  funcion: "Mostrar el esplendor del sultán o el sha y embellecer el libro, la mezquita y el palacio."
  artista: "Talleres de corte (nakkaşhane) con maestros con nombre y salario fijo del Estado."
en:
  area: "West Asia and the Islamic world"
  concepto: "Ottomans and Safavids develop a refined court art: miniature, İznik ceramics, carpets, architecture."
  funcion: "To display the splendour of the sultan or shah and beautify the book, the mosque and the palace."
  artista: "Court workshops (nakkaşhane) with named masters on a fixed state salary."
