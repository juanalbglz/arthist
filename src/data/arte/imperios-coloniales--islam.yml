id: imperios-coloniales--islam
epoca: imperios-coloniales
sociedades:
  - asia-occidental
es:
  area: "Asia occidental y mundo islámico"
  concepto: "Europa pinta un Oriente imaginado (orientalismo); en Estambul se crean academias y museos al modo europeo."
  funcion: "Modernizar el imperio otomano y, con Osman Hamdi, responder a la mirada europea."
  artista: "Aparece el pintor de academia con formación en París, aunque el mercado local es pequeño."
en:
  area: "West Asia and the Islamic world"
  concepto: "Europe paints an imagined East (Orientalism); Istanbul founds academies and museums on the European model."
  funcion: "To modernise the Ottoman Empire and, with Osman Hamdi, answer the European gaze."
  artista: "The academy-trained painter appears, often educated in Paris, though the local market is small."
