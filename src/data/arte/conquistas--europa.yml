id: conquistas--europa
epoca: conquistas
sociedades:
  - europa
es:
  area: "Europa"
  concepto: "Con el Renacimiento, el arte se vuelve «cosa mental», junto a la ciencia y la poesía. Nace la idea del genio."
  funcion: "Glorificar a príncipes y papas, convencer en la Contrarreforma con el barroco y, en Holanda, decorar casas burguesas."
  artista: "Del gremio a la academia: el artista firma, pide precio alto y busca mecenas; en Ámsterdam ya vende en un mercado."
en:
  area: "Europe"
  concepto: "With the Renaissance art becomes “a mental thing”, alongside science and poetry. The idea of genius is born."
  funcion: "To glorify princes and popes, persuade in the Counter-Reformation through the Baroque and, in Holland, decorate bourgeois homes."
  artista: "From guild to academy: the artist signs, asks high fees and seeks patrons; in Amsterdam they already sell on a market."
