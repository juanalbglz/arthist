id: tiempo-profundo--america
epoca: tiempo-profundo
sociedades:
  - mesoamerica
  - andes
  - norteamerica
  - sudamerica
  - caribe
es:
  area: "América"
  concepto: "Los primeros pobladores traen imágenes asociadas al rito y al paisaje, como las manos de la Cueva de las Manos."
  funcion: "Marcar territorio y memoria del grupo, señalar lugares sagrados o de reunión."
  artista: "No hay especialistas: es una práctica colectiva de grupos cazadores y recolectores."
en:
  area: "The Americas"
  concepto: "The first settlers bring images tied to ritual and landscape, like the hands at the Cueva de las Manos."
  funcion: "To mark territory and group memory and to signal sacred or gathering places."
  artista: "There are no specialists: it is a collective practice of hunter-gatherer groups."
