id: imperios-coloniales--asia-sur
epoca: imperios-coloniales
sociedades:
  - asia-sur
  - sudeste-asiatico
es:
  area: "Asia del sur y sudeste asiático"
  concepto: "El poder colonial separa «bellas artes» de «artesanía» y crea escuelas de arte a la británica."
  funcion: "Documentar la colonia para los británicos (pintura de la Compañía) y, con Raja Ravi Varma, imaginar a los dioses en clave nacional."
  artista: "Pintores asalariados de patronos coloniales; Varma vende reproducciones en litografía a un público masivo."
en:
  area: "South and Southeast Asia"
  concepto: "Colonial rule separates “fine art” from “craft” and sets up British-style art schools."
  funcion: "To document the colony for the British (Company painting) and, with Raja Ravi Varma, imagine the gods in a national key."
  artista: "Painters paid by colonial patrons; Varma sells lithograph reproductions to a mass public."
