en:
  area: "Canary Islands"
  concepto: "Gaceta de Arte (1932) connects Tenerife to the avant-garde; the Luján Pérez School seeks an Indigenist Canarian art."
  funcion: "To modernise island culture, host the 1935 Surrealist exhibition and look to the Aboriginal past."
  artista: "Artists, writers and teachers funded by magazines, patrons and teaching."
