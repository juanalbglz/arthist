id: reinos--islam
epoca: reinos
sociedades:
  - asia-occidental
es:
  area: "Asia occidental y mundo islámico"
  concepto: "Se evita la figura en lo religioso; el arte mayor es la palabra de Dios escrita, la caligrafía, y la geometría infinita."
  funcion: "Hacer visible lo divino sin representarlo, embellecer mezquitas, libros y objetos cotidianos."
  artista: "Calígrafos con gran prestigio y nombre propio; ceramistas, tejedores y arquitectos trabajan en talleres de corte y bazar."
en:
  area: "West Asia and the Islamic world"
  concepto: "Figures are avoided in religious settings; the highest art is God’s written word, calligraphy, and infinite geometry."
  funcion: "To make the divine visible without depicting it and embellish mosques, books and everyday objects."
  artista: "Highly prestigious calligraphers known by name; potters, weavers and architects work in court and bazaar workshops."
