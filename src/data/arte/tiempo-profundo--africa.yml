id: tiempo-profundo--africa
epoca: tiempo-profundo
sociedades:
  - africa
es:
  area: "África"
  concepto: "No hay una palabra para «arte»: grabar ocre o ensartar conchas es parte de quién eres y a qué grupo perteneces."
  funcion: "Marcar identidad y pertenencia, intercambiar adornos entre grupos lejanos y, quizá, fijar símbolos que todos entienden (Blombos, hace 75.000 años)."
  artista: "No hay oficio de artista. Cualquier miembro del grupo podía hacerlo; algunas personas serían más hábiles."
en:
  area: "Africa"
  concepto: "There is no word for “art”: engraving ochre or stringing shells is part of who you are and which group you belong to."
  funcion: "To mark identity and belonging, exchange ornaments between distant groups and perhaps fix shared symbols (Blombos, 75,000 years ago)."
  artista: "There is no artist trade. Any member of the group could make it; some people were surely more skilled."
