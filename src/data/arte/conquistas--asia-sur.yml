id: conquistas--asia-sur
epoca: conquistas
sociedades:
  - asia-sur
  - sudeste-asiatico
es:
  area: "Asia del sur y sudeste asiático"
  concepto: "En la corte mogol la pintura une tradiciones persas e indias y se vuelve observación del mundo y retrato."
  funcion: "Contar la historia del emperador, documentar la naturaleza y mostrar el poder imperial."
  artista: "Pintores de taller imperial, a sueldo; algunos son reconocidos por su nombre, como Basawan o Mansur."
en:
  area: "South and Southeast Asia"
  concepto: "At the Mughal court, painting fuses Persian and Indian traditions and becomes observation of the world and portraiture."
  funcion: "To tell the emperor’s story, document nature and display imperial power."
  artista: "Salaried imperial workshop painters; some are known by name, like Basawan or Mansur."
