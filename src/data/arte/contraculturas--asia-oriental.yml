id: contraculturas--asia-oriental
epoca: contraculturas
sociedades:
  - china
  - japon
es:
  area: "Asia oriental (China, Japón)"
  concepto: "En Japón, Mono-ha trabaja con materiales tal como son; en China, tras Mao, grupos como Las Estrellas (1979) piden libertad."
  funcion: "Reflexionar sobre la materia y el espacio; en China, abrir un espacio de expresión individual."
  artista: "En China, artistas al margen del sistema oficial; en Japón, galerías y universidades."
en:
  area: "East Asia (China, Japan)"
  concepto: "In Japan, Mono-ha works with materials as they are; in China, after Mao, groups like the Stars (1979) demand freedom."
  funcion: "To reflect on matter and space; in China, to open room for individual expression."
  artista: "In China, artists outside the official system; in Japan, galleries and universities."
