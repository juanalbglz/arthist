id: tiempo-profundo--europa
epoca: tiempo-profundo
sociedades:
  - europa
es:
  area: "Europa"
  concepto: "Pintar en el fondo de una cueva no es decorar: es un acto que pertenece al rito y a la caza, no a la contemplación."
  funcion: "Relacionarse con los animales y lo sagrado, reunir al grupo en lugares especiales y transmitir saberes de generación en generación."
  artista: "No existe el artista profesional. Las manos en negativo de Chauvet o Altamira son de hombres, mujeres y niños."
en:
  area: "Europe"
  concepto: "Painting deep inside a cave is not decoration: it belongs to ritual and hunting, not to contemplation."
  funcion: "To relate to animals and the sacred, gather the group in special places and pass knowledge down the generations."
  artista: "There is no professional artist. The negative hand stencils at Chauvet or Altamira belong to men, women and children."
