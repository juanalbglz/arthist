es:
  area: "América Latina y el Caribe"
  concepto: "Bajo las dictaduras el arte se vuelve conceptual y político (Tucumán Arde, CADA, arte correo)."
  funcion: "Denunciar, burlar la censura y crear redes de resistencia."
  artista: "Artistas perseguidos o exiliados, sin mercado, que se organizan en colectivos."
en:
