id: tiempo-profundo--asia
epoca: tiempo-profundo
sociedades:
  - china
  - japon
  - asia-sur
  - sudeste-asiatico
es:
  area: "Asia"
  concepto: "Como en África y Europa, la imagen está unida al rito: en Sulawesi se pintan animales y escenas de caza hace más de 45.000 años."
  funcion: "Contar relaciones entre humanos y animales, marcar lugares y quizá pedir abundancia."
  artista: "Lo hace el grupo, sin especialistas pagados: no hay excedente que permita vivir de ello."
en:
  area: "Asia"
  concepto: "As in Africa and Europe, images are bound to ritual: in Sulawesi, animals and hunting scenes were painted over 45,000 years ago."
  funcion: "To tell the bonds between humans and animals, mark places and perhaps ask for abundance."
  artista: "The group makes it, with no paid specialists: there is no surplus to live from it."
