en:
  area: "Canary Islands"
  concepto: "New museums (CAAM, TEA) and biennials place the Canaries between Europe, Africa and the Americas."
  funcion: "To think about territory, tourism and Atlantic identity."
  artista: "Artists living from teaching, grants and public commissions; the local market is small."
