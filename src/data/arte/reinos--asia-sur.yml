id: reinos--asia-sur
epoca: reinos
sociedades:
  - asia-sur
  - sudeste-asiatico
es:
  area: "Asia del sur y sudeste asiático"
  concepto: "El templo es una imagen del cosmos; los tratados (shilpa shastras) fijan proporciones y reglas sagradas."
  funcion: "Facilitar el encuentro con lo divino (darshan), legitimar a las dinastías y ordenar el espacio, como en Angkor o Borobudur."
  artista: "Gremios hereditarios de escultores y arquitectos, con estatus de casta; trabajan para templos y reyes."
en:
  area: "South and Southeast Asia"
  concepto: "The temple is an image of the cosmos; treatises (shilpa shastras) set sacred proportions and rules."
  funcion: "To enable meeting the divine (darshan), legitimise dynasties and order space, as at Angkor or Borobudur."
  artista: "Hereditary guilds of sculptors and architects with caste status; they work for temples and kings."
