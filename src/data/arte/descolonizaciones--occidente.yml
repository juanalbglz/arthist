id: descolonizaciones--occidente
epoca: descolonizaciones
sociedades:
  - europa
  - norteamerica
es:
  area: "Europa y Norteamérica"
  concepto: "Nueva York sustituye a París: el arte es gesto (expresionismo abstracto) y luego objeto de consumo (pop)."
  funcion: "Expresar la libertad individual, también como arma de la Guerra Fría, y reflejar la sociedad de consumo."
  artista: "Mercado de galerías y museos; aparece el artista estrella que se hace rico, como Warhol."
en:
  area: "Europe and North America"
  concepto: "New York replaces Paris: art is gesture (Abstract Expressionism) and later consumer object (Pop)."
  funcion: "To express individual freedom, also as a Cold War weapon, and reflect consumer society."
  artista: "A market of galleries and museums; the star artist who gets rich appears, like Warhol."
