id: contraculturas--occidente
epoca: contraculturas
sociedades:
  - europa
  - norteamerica
es:
  area: "Europa y Norteamérica"
  concepto: "El arte puede ser una idea, una acción o el propio cuerpo (conceptual, performance, Fluxus, feminismo)."
  funcion: "Criticar el museo, el mercado y la sociedad; en los ochenta, el mercado vuelve con fuerza."
  artista: "Artistas que rechazan vender objetos y viven de becas y docencia, y otros que se hacen ricos en el boom de los ochenta."
en:
  area: "Europe and North America"
  concepto: "Art can be an idea, an action or the body itself (Conceptual art, performance, Fluxus, feminism)."
  funcion: "To critique the museum, the market and society; in the 1980s the market returns in force."
  artista: "Artists who refuse to sell objects and live from grants and teaching, and others who get rich in the 1980s boom."
