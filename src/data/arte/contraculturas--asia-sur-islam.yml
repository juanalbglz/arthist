es:
  area: "Asia del sur y Oriente Próximo"
  concepto: "En la India surge la figuración narrativa de Baroda; en Irán, la revolución de 1979 impone nuevos límites."
  funcion: "Contar lo cotidiano y lo político; en Irán, servir a la revolución o expresarse en el exilio."
  artista: "Profesores universitarios y artistas exiliados en un mercado aún pequeño."
en:
  area: "South Asia and the Middle East"
  concepto: "In India the narrative figuration of Baroda emerges; in Iran the 1979 revolution sets new limits."
  funcion: "To tell everyday and political life; in Iran, to serve the revolution or speak in exile."
  artista: "University teachers and exiled artists in a still-small market."
