id: descolonizaciones--latinoamerica
epoca: descolonizaciones
sociedades:
  - mesoamerica
  - andes
  - sudamerica
  - caribe
es:
  area: "América Latina y el Caribe"
  concepto: "Abstracción, arte cinético y neoconcreto: el espectador pasa a ser parte de la obra (Lygia Clark, Hélio Oiticica)."
  funcion: "Construir países modernos y, después, implicar el cuerpo y la vida del público."
  artista: "Artistas apoyados por bienales y algún Estado desarrollista; muchos emigran a París o Nueva York."
en:
  area: "Latin America and the Caribbean"
  concepto: "Abstraction, kinetic and Neo-Concrete art: the viewer becomes part of the work (Lygia Clark, Hélio Oiticica)."
  funcion: "To build modern nations and later to involve the public’s body and life."
  artista: "Artists supported by biennials and developmentalist states; many emigrate to Paris or New York."
