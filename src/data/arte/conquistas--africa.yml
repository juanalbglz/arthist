id: conquistas--africa
epoca: conquistas
sociedades:
  - africa
es:
  area: "África"
  concepto: "Los bronces de Benín narran la historia de la corte; los europeos llevan marfiles afroportugueses como curiosidades."
  funcion: "Registrar la historia del reino, honrar al oba y a los ancestros y comerciar con los europeos."
  artista: "Gremios de fundidores que viven en barrios propios y trabajan solo para el rey."
en:
  area: "Africa"
  concepto: "The Benin bronzes narrate the history of the court; Europeans take Afro-Portuguese ivories as curiosities."
  funcion: "To record the kingdom’s history, honour the oba and the ancestors and trade with Europeans."
  artista: "Guilds of casters living in their own quarters and working only for the king."
