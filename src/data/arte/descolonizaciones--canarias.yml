id: descolonizaciones--canarias
epoca: descolonizaciones
sociedades:
  - canarias
  - atlantico
es:
  area: "Canarias"
  concepto: "Bajo el franquismo, artistas como Manolo Millares (El Paso) usan la materia rota para hablar del drama."
  funcion: "Renovar el arte español, recuperar lo aborigen en otra clave y, con César Manrique, mirar el paisaje."
  artista: "Muchos tienen que emigrar a Madrid; viven de galerías, encargos y, más tarde, del turismo."
en:
  area: "Canary Islands"
  concepto: "Under Franco, artists like Manolo Millares (El Paso) use torn matter to speak of drama."
  funcion: "To renew Spanish art, revisit the Aboriginal past in another key and, with César Manrique, look at landscape."
  artista: "Many must emigrate to Madrid; they live from galleries, commissions and, later, tourism."
