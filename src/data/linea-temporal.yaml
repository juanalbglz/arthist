# Línea temporal comparada: historia del arte e historia mundial.
#
# Cada hito es una entrada. Para añadir uno, copia un bloque y cambia los valores.
#   id:          identificador único, sin espacios (no se ve en la web)
#   año:         número para ordenar; negativo = antes de Cristo (-3200 = 3200 a. C.)
#   fecha:       opcional, cómo se escribe la fecha en la web si no basta con el año
#   pista:       arte | mundo
#   sociedad:    a qué sociedad o área cultural pertenece; ver la lista en src/linea-temporal.ts
#   wiki:        título del artículo de Wikipedia en cada idioma (si no existe exacto, el enlace abre la búsqueda)
#   disciplinas: solo en la pista de arte; ver la lista en src/linea-temporal.ts
#   imagen:      opcional. Por defecto se usa la imagen libre del artículo de Wikipedia.
#                Escribe el nombre de un archivo de Wikimedia Commons para elegir otra,
#                o «no» para dejar el hito sin imagen.
#   enlaces:     opcional, otras fuentes: - { titulo: "Museo X", url: "https://..." }
#   peliculas:   opcional, películas o documentales relacionados:
#                - { titulo: "Título", año: 2010, tipo: pelicula | documental | corto, direccion: "Nombre" }
#   es / en:     título y texto breve en cada idioma
#
# El orden dentro del archivo da igual: la web los ordena por año.

